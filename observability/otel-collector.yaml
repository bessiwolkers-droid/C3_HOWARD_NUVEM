receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
  # Remove IP e user agent dos spans antes de exibir nos logs (LGPD)
  attributes/sem-dados-pessoais:
    actions:
      - {key: client.address, action: delete}
      - {key: net.peer.ip, action: delete}
      - {key: net.sock.peer.addr, action: delete}
      - {key: http.client_ip, action: delete}
      - {key: http.user_agent, action: delete}
      - {key: user_agent.original, action: delete}
exporters:
  debug:
    verbosity: detailed
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/sem-dados-pessoais, batch]
      exporters: [debug]
