name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install fastapi==0.115.6 httpx==0.28.1 redis==5.2.1 PyJWT==2.10.1 qdrant-client==1.12.1 opentelemetry-api==1.29.0 opentelemetry-sdk==1.29.0 opentelemetry-exporter-otlp-proto-grpc==1.29.0 opentelemetry-instrumentation-fastapi==0.50b0 opentelemetry-instrumentation-httpx==0.50b0 opentelemetry-instrumentation-redis==0.50b0 uvicorn[standard]==0.34.0 pytest==8.3.4
      - run: python -m compileall -q services tests
      - run: pytest -q
