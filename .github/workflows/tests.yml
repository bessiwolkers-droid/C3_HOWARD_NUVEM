name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q services tests
      - run: pytest -q
  compose:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cria .env com segredos aleatorios
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^DEMO_PASSWORD=.*/DEMO_PASSWORD=$(openssl rand -hex 16)/" .env
      - run: docker compose up --build -d
      - run: bash scripts/smoke-test.sh
      - name: Logs dos servicos
        if: always()
        run: docker compose logs --no-color gateway worker inference vectorstore
      - if: always()
        run: docker compose down -v
